[project]
name = "turbovec-mcp"
version = "0.1.0"
description = "MCP server for local semantic code search backed by turbovec (TurboQuant) - bring your own OpenAI-compatible embeddings."
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10"
authors = [{ name = "potatofacee" }]
keywords = ["mcp", "turbovec", "turboquant", "vector-search", "code-search", "rag", "embeddings"]
dependencies = [
  "mcp>=1.2.0",
  "turbovec>=0.1.0",
  "httpx>=0.27",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
turbovec-mcp = "turbovec_mcp.server:main"

[project.urls]
Homepage = "https://github.com/potatofacee/turbovec-mcp"
Issues = "https://github.com/potatofacee/turbovec-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turbovec_mcp"]
